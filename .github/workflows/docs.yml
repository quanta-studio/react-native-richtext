name: Docs

on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          standalone: true

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: docs-site

      - name: Build
        run: pnpm build
        working-directory: docs-site

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages from the workflow so the deploy never depends on the one-time
          # manual "Settings → Pages → GitHub Actions" toggle being set first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

      - uses: actions/deploy-pages@v4
