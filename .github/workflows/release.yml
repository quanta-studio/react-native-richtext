name: Release

on:
  push:
    branches: [main]

# Queue (never cancel) overlapping runs so an in-flight publish is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Git hooks are for local dev. Husky's commit-msg hook runs commitlint, which
    # rejects the Changesets bot's "Version Packages" commit (not Conventional
    # Commits) and fails the release. HUSKY=0 skips hook installation in CI.
    env:
      HUSKY: '0'
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance: lets the job mint an OIDC token that npm
      # verifies to attest the packages were built by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Changesets needs full history to diff against the base branch.
          fetch-depth: 0

      # No registry-url/scope on purpose. Those make setup-node write an ~/.npmrc
      # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and pnpm
      # merges registry auth with `??=` — a present-but-empty _authToken would win
      # over the token it mints via OIDC and break the publish. The registry is
      # already pinned per package by `publishConfig.registry`.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # standalone: true installs pnpm as a self-contained binary (bundled Node), so
      # pnpm 11.5.2 (whose npm manifest requires Node >=22.13) installs regardless of
      # the Actions runner's Node runtime. Node 22 above runs the scripts.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          standalone: true

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # Used by changesets/action to open the "Version Packages" PR / release.
          # There is deliberately NO npm credential here: changesets shells out to
          # `pnpm publish`, and pnpm 11.5.2 mints a short-lived registry token itself
          # by exchanging the Actions OIDC id-token (npm trusted publishing), then
          # derives provenance from it. Do not set NPM_CONFIG_PROVENANCE — pnpm only
          # auto-determines provenance when the option is left unset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
