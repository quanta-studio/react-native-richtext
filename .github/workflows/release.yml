name: Release

on:
  push:
    branches: [main]

# Queue (never cancel) overlapping runs so an in-flight publish is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs full history to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes a CI-only ~/.npmrc wired to NODE_AUTH_TOKEN (keeps auth out of the repo).
          registry-url: 'https://registry.npmjs.org'

      # standalone: true installs pnpm as a self-contained binary (bundled Node), so
      # pnpm 11.5.2 (whose npm manifest requires Node >=22.13) installs regardless of
      # the Actions runner's Node 20 runtime. Node 22 above runs the scripts.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          standalone: true

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
