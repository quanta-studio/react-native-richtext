name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # standalone: true installs pnpm as a self-contained binary (bundled Node), so
      # pnpm 11.5.2 (whose npm manifest requires Node >=22.13) installs regardless of
      # the Actions runner's Node 20 runtime. Node 22 above runs the scripts.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          standalone: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
